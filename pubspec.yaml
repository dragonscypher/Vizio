name: vizio
description: A cross-device XR assistant with phone AR, VR split view, offline AI, and graceful fallbacks.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  camera: 0.10.6
  ar_flutter_plugin:
    path: packages/ar_flutter_plugin
  flutter_webrtc: ">=0.11.0 <2.0.0"
  shared_preferences: ^2.0.15
  path_provider: ^2.0.11
  image: ^3.2.2  # For image processing (if needed for preprocessing)
  tflite_flutter: ^0.11.0  # TFLite inference via FFI
  flutter_tts: ^4.2.0      # Text-to-speech for vision-assist mode
  speech_to_text: ^7.0.0   # Speech-to-text for hearing-assist mode

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tflite/object_detection.tflite
    - assets/faces/known_faces.json
